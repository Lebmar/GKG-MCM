name: Financial accounting and causal timing checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # nbformat is used by the notebook-building script and its test, but it
      # is not a runtime dependency of the audited pipeline, so it is pulled
      # in for CI only.
      - run: python -m pip install -r requirements.txt nbformat
      # Several replay tests exercise the project-venv interpreter path.
      # Provide one so isolation tests run in CI as they do locally.
      - run: python -m venv --system-site-packages .venv
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
