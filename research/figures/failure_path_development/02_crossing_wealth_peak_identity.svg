     <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24323c" x="289.429875" y="91.644525" transform="rotate(-0 289.429875 91.644525)">Inherited peak ratio part</text>
    </g>
   </g>
  </g>
  <g id="text_34">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24323c" x="540" y="32.037187" transform="rotate(-0 540 32.037187)">Five model-only crossings: wealth and historical peak can offset</text>
  </g>
  <g id="text_35">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #24323c" transform="translate(64.8 512.813437)">Exact identity: DD(M)-DD(B) = [R(B)-R(M)]/P(B) + R(M) × [1/P(B)-1/P(M)].</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #24323c" transform="translate(64.8 527.216719)">Signed components describe current DD at the model's crossing. They are not additive lifetime-MDD or causal effects.</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #24323c" transform="translate(64.8 541.62)">In Inner 112 and R5 112, higher model wealth coexists with a higher drawdown. Repeated 112 contexts are dependent.</text>
  </g>
